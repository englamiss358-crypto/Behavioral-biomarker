<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Verification</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap");

    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --line: #d8e2ef;
      --text: #16273e;
      --muted: #5f7593;
      --ok: #1a8f60;
      --warn: #bf7a00;
      --bad: #b6404f;
      --accent: #255ea8;
      --shadow: 0 20px 46px rgba(16, 39, 66, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(40rem 24rem at 5% -10%, #dcecff, transparent 60%),
                  radial-gradient(42rem 24rem at 95% -12%, #e4f4f2, transparent 60%),
                  var(--bg);
      color: var(--text);
      font-family: "Manrope", "Segoe UI", sans-serif;
      padding: 18px;
    }

    html[lang="ar"] body {
      font-family: "Cairo", "Segoe UI", sans-serif;
    }

    .card {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #f8fbff;
      display: grid;
      gap: 6px;
    }

    .status-label {
      margin: 0;
      font-size: 0.82rem;
      color: #667f9f;
      font-weight: 700;
    }

    .status-value {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
    }

    .status-value.ok {
      color: var(--ok);
    }

    .status-value.warn {
      color: var(--warn);
    }

    .status-value.bad {
      color: var(--bad);
    }

    .meta {
      margin: 0;
      font-size: 0.88rem;
      color: #345377;
      line-height: 1.7;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      text-decoration: none;
      color: #17365a;
      font-weight: 700;
      background: #fff;
    }

    .btn.primary {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, #255ea8, #1a8f60);
    }

    @media (max-width: 700px) {
      .card {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title" id="title">Payment Verification</h1>
    <p class="copy" id="copy">Please wait while we verify your payment.</p>

    <section class="status" aria-live="polite">
      <p class="status-label" id="statusLabel">Status</p>
      <p class="status-value" id="statusValue">Checking...</p>
      <p class="meta" id="meta"></p>
    </section>

    <div class="actions">
      <a class="btn primary" id="backBtn" href="index.html">Back to Home</a>
      <a class="btn" href="04-clinician-dashboard.html" id="dashboardBtn">Open Clinician Dashboard</a>
    </div>
  </main>

  <script>
    const text = {
      en: {
        title: "Payment Verification",
        copy: "Please wait while we verify your payment.",
        statusLabel: "Status",
        checking: "Checking...",
        missingToken: "Missing payment token",
        missingTokenCopy: "This callback does not include payment_token, so card payment cannot be verified.",
        walletSuccess: "Wallet payment success",
        walletSuccessCopy: "Wallet payments are final at checkout. Transaction reference is available below.",
        firstValid: "Payment confirmed (first verification)",
        firstValidCopy: "Payment is valid and verified for the first time. You can safely deliver service now.",
        alreadyUsed: "Payment already verified",
        alreadyUsedCopy: "This payment token was used before. Do not deliver again.",
        invalid: "Invalid or expired token",
        invalidCopy: "Payment token is invalid, expired, or tampered.",
        verifyError: "Verification error",
        verifyErrorCopy: "Could not verify payment right now. Please retry or contact support.",
        backBtn: "Back to Home",
        dashboardBtn: "Open Clinician Dashboard",
        metaTxn: "Transaction",
        metaAmount: "Amount",
        metaDesc: "Description",
        metaStatus: "Status Query",
        metaSub: "Subscription"
      },
      ar: {
        title: "التحقق من الدفع",
        copy: "يرجى الانتظار أثناء التحقق من عملية الدفع.",
        statusLabel: "الحالة",
        checking: "جارٍ التحقق...",
        missingToken: "لا يوجد payment_token",
        missingTokenCopy: "رابط الرجوع لا يحتوي على payment_token، لذلك لا يمكن التحقق من دفع البطاقة.",
        walletSuccess: "نجاح دفع المحفظة",
        walletSuccessCopy: "دفع المحفظة يُعد نهائيًا عند الشراء. رقم العملية موجود بالأسفل.",
        firstValid: "تم تأكيد الدفع (أول تحقق)",
        firstValidCopy: "الدفع صحيح وتم التحقق منه لأول مرة. يمكن تقديم الخدمة الآن بأمان.",
        alreadyUsed: "تم التحقق من العملية سابقًا",
        alreadyUsedCopy: "هذا التوكن تم استخدامه من قبل. لا تقدمي الخدمة مرة ثانية.",
        invalid: "توكن غير صالح أو منتهي",
        invalidCopy: "توكن الدفع غير صالح أو منتهي أو تم التلاعب به.",
        verifyError: "خطأ أثناء التحقق",
        verifyErrorCopy: "تعذر التحقق الآن. حاولي مرة أخرى أو تواصلي مع الدعم.",
        backBtn: "العودة للرئيسية",
        dashboardBtn: "فتح لوحة الأخصائي",
        metaTxn: "رقم العملية",
        metaAmount: "المبلغ",
        metaDesc: "الوصف",
        metaStatus: "حالة الرابط",
        metaSub: "الاشتراك"
      }
    };

    const statusValue = document.getElementById("statusValue");
    const meta = document.getElementById("meta");
    const title = document.getElementById("title");
    const copy = document.getElementById("copy");
    const statusLabel = document.getElementById("statusLabel");
    const backBtn = document.getElementById("backBtn");
    const dashboardBtn = document.getElementById("dashboardBtn");

    function lang() {
      const saved = (localStorage.getItem("bbel-lang") || "").toLowerCase();
      if (saved.startsWith("ar")) {
        return "ar";
      }

      const urlLang = (new URLSearchParams(window.location.search).get("lang") || "").toLowerCase();
      if (urlLang.startsWith("ar")) {
        return "ar";
      }

      return (navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en";
    }

    function applyLanguage(selected) {
      const map = text[selected];
      document.documentElement.lang = selected;
      document.documentElement.dir = selected === "ar" ? "rtl" : "ltr";
      document.title = map.title;
      title.textContent = map.title;
      copy.textContent = map.copy;
      statusLabel.textContent = map.statusLabel;
      statusValue.textContent = map.checking;
      backBtn.textContent = map.backBtn;
      dashboardBtn.textContent = map.dashboardBtn;
    }

    function setStatus(kind, titleText, bodyText) {
      statusValue.className = `status-value ${kind}`;
      statusValue.textContent = titleText;
      copy.textContent = bodyText;
    }

    function renderMeta(map, payload) {
      const rows = [];
      if (payload.txn) rows.push(`${map.metaTxn}: ${payload.txn}`);
      if (payload.amount) rows.push(`${map.metaAmount}: ${payload.amount}${payload.currency ? ` ${payload.currency}` : ""}`);
      if (payload.description) rows.push(`${map.metaDesc}: ${payload.description}`);
      if (payload.queryStatus) rows.push(`${map.metaStatus}: ${payload.queryStatus}`);
      if (payload.subscription) rows.push(`${map.metaSub}: ${payload.subscription}`);
      meta.textContent = rows.join("\n");
    }

    async function verifyPayment() {
      const selected = lang();
      const map = text[selected];
      applyLanguage(selected);

      const params = new URLSearchParams(window.location.search);
      const paymentToken = params.get("payment_token");
      const queryStatus = params.get("status");
      const txn = params.get("txn");
      const subscription = params.get("subscription");

      if (!paymentToken) {
        if (queryStatus === "success" && txn) {
          setStatus("ok", map.walletSuccess, map.walletSuccessCopy);
          renderMeta(map, { txn, queryStatus, subscription });
          return;
        }

        setStatus("warn", map.missingToken, map.missingTokenCopy);
        renderMeta(map, { txn, queryStatus, subscription });
        return;
      }

      try {
        const response = await fetch("https://api.gammal.tech/sdk/pay/link/verify.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ payment_token: paymentToken })
        });

        const result = await response.json();
        const payload = {
          txn: result.txn || txn,
          amount: result.amount,
          currency: result.currency,
          description: result.description,
          queryStatus,
          subscription
        };

        if (Number(result.status) === 1) {
          setStatus("ok", map.firstValid, map.firstValidCopy);
          renderMeta(map, payload);
          return;
        }

        if (Number(result.status) === 2) {
          setStatus("warn", map.alreadyUsed, map.alreadyUsedCopy);
          renderMeta(map, payload);
          return;
        }

        setStatus("bad", map.invalid, map.invalidCopy);
        renderMeta(map, payload);
      } catch {
        setStatus("bad", map.verifyError, map.verifyErrorCopy);
        renderMeta(map, { txn, queryStatus, subscription });
      }
    }

    verifyPayment();
  </script>
</body>
</html>
